name: Test casks and formulae
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  audit:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Symlink checkout as a Homebrew tap
        run: |
          set -euo pipefail
          taps_dir="$(brew --repository)/Library/Taps/reyemtech"
          mkdir -p "$taps_dir"
          ln -sf "$GITHUB_WORKSPACE" "$taps_dir/homebrew-tap"
      # Homebrew 7 refuses to load formulae from third-party taps until they are trusted.
      - run: brew trust reyemtech/tap
      - name: Audit casks (strict)
        run: brew audit --strict --cask $(for f in Casks/*.rb; do echo "reyemtech/tap/$(basename "$f" .rb)"; done)
      # Formulae are generated by each project's release tooling (cargo-dist for axle) and
      # rewritten on every release, so they get the standard audit; strict only flags style
      # such as an explicit `version` that dist always writes.
      - name: Audit formulae
        run: brew audit --formula $(for f in Formula/*.rb; do echo "reyemtech/tap/$(basename "$f" .rb)"; done)
